name: Windows MSI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  # GitHub requires write-level repository access to download draft release assets.
  # This workflow runs only on trusted manual dispatches and release tags.
  contents: write
jobs:
  windows-msi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Download pinned build archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deps=Get-Content release/dependencies.json -Raw|ConvertFrom-Json
          New-Item -ItemType Directory -Path build-inputs|Out-Null
          gh release download $deps.release_tag --repo $env:GITHUB_REPOSITORY --dir build-inputs --pattern $deps.native.name --pattern $deps.camera.name
          if($LASTEXITCODE -ne 0){throw 'Release build inputs could not be downloaded'}
      - name: Build and verify paired AC / AC+ MSIs without installing
        shell: pwsh
        run: |
          $deps=Get-Content release/dependencies.json -Raw|ConvertFrom-Json
          $native=Join-Path build-inputs $deps.native.name
          $camera=Join-Path build-inputs $deps.camera.name
          # One shared core, two Windows products from one checkout. AC is the base
          # edition; AC+ (acplus) additionally ships one-touch Service Mode. They
          # share MSI lineage and differ only by the edition stamp and filename.
          #
          # Each edition builds in its OWN pwsh PROCESS. Build-Installer's GStreamer
          # payload check loads the native gstreamer library and calls gst_init in
          # process; building the second edition in the same process would reuse that
          # already-initialised library and its registry, failing the payload test on
          # an otherwise-identical payload. A fresh process per edition isolates it.
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/Build-Installer.ps1 `
            -Edition ac -OutputDir artifacts/release -NativeArchive $native -CameraArchive $camera
          if($LASTEXITCODE -ne 0){throw 'AC MSI build failed'}
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/Build-Installer.ps1 `
            -Edition acplus -OutputDir artifacts/release -NativeArchive $native -CameraArchive $camera
          if($LASTEXITCODE -ne 0){throw 'AC+ MSI build failed'}
          $commit=git rev-parse HEAD
          ./tools/Verify-PairedInstallerRelease.ps1 -CoreRecord artifacts/release/public-msi-build-result-ac.json -PlusRecord artifacts/release/public-msi-build-result-acplus.json -SourceCommit $commit
          if($LASTEXITCODE -ne 0){throw 'Paired installer release verification failed'}
          # Raw build records carry machine-local paths and are not uploaded
          # (the artifact step below globs only *.msi and SHA256SUMS.txt).
          Get-ChildItem artifacts/release -Filter '*.msi'|ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }|Set-Content -Encoding ascii artifacts/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-windows-msi
          path: |
            artifacts/release/*.msi
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
