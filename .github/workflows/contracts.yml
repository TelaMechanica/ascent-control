name: Shared contract checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --require-hashes -r firmware/mode_a/requirements-builder.txt
      - run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - run: python tools/check_camera_source.py
      - run: python -m pytest tests -q
        env:
          ASCENT_ARM_TOOLCHAIN_DIR: /usr/bin
      - run: python tools/check_tree.py
      - run: python tools/check_public_runtime.py
